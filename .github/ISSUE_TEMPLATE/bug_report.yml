name: Bug report
description: A wrong result, an enclosure that misses the true value, an unexpected error or a crash.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Shortest code that shows the problem
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: certoutage version
      description: Output of `python -c "import certoutage; print(certoutage.__version__)"`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
