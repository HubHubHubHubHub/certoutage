name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python: "3.11"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Non-editable install: the tests import the installed package, not src/.
      - name: Install
        run: python -m pip install ".[test]"
      - name: Check dependencies
        run: python -m pip check
      # Includes tests/regression/test_table_ii_example.py: Table II, bit for bit.
      - name: Test suite
        run: python -m pytest

  # The guards must hold when Python strips assert statements (python -O).
  # pytest still checks the asserts of the test modules, which it rewrites.
  optimized:
    name: ubuntu-latest / Python 3.13 / python -O
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[test]"
      - name: Check dependencies
        run: python -m pip check
      - name: Test suite under python -O
        run: python -O -m pytest
